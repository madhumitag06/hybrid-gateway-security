name: Continuous Integration & Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test & Schema Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrid_gateway_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      APP_ENV: testing
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5434/hybrid_gateway_db
      GATEWAY_SERVICE_KEY: test-insecure-gateway-service-key-for-ci-testing-only-min32
      AUTH_JWT_SECRET: test-insecure-jwt-secret-for-ci-testing-only-min32
      SECRET_KEY: test-insecure-app-secret-for-ci-testing-only-min32
      ADMIN_PASSWORD: TestSecureAdminPassword2026!
      ALLOW_MOCK_AUTH: "false"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ml/requirements.txt
          pip install pytest pytest-asyncio httpx xgboost scikit-learn psycopg psycopg-binary

      - name: Run Complete Backend Pytest Suite
        run: |
          pytest -v backend/tests/

  frontend-build:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check
        run: npx tsc -b

      - name: Lint Frontend
        run: npm run lint

      - name: Vite Production Build
        run: npm run build
