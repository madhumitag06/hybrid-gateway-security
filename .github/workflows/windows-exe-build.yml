name: Standalone Windows Executable Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: PyInstaller Package on Windows Runner
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Install Python & PyInstaller Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ml/requirements.txt
          pip install pyinstaller xgboost scikit-learn

      - name: Execute Automated 17-Step Packaging Pipeline
        shell: powershell
        run: |
          powershell.exe -ExecutionPolicy Bypass -File backend/build_exe.ps1

      - name: Verify Packaged Distribution & Secret Hygiene
        shell: powershell
        run: |
          $exe = "backend\executable\AdaptiveSecurityGateway\AdaptiveSecurityGateway.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Executable generation failed: $exe not found."
            exit 1
          }
          if (Test-Path "backend\executable\AdaptiveSecurityGateway\.env") {
            Write-Error "SEC-04 Violation: Embedded .env detected in root output."
            exit 1
          }
          if (Test-Path "backend\executable\AdaptiveSecurityGateway\_internal\.env") {
            Write-Error "SEC-04 Violation: Embedded .env detected in _internal."
            exit 1
          }
          Write-Host "Executable and asset distribution successfully verified: $exe"

      - name: Upload Windows Executable Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdaptiveSecurityGateway-Windows-x64
          path: backend/executable/AdaptiveSecurityGateway/
          retention-days: 14
