name: Standalone Windows Executable Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: PyInstaller Package on Windows Runner
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build Frontend Distribution
        run: |
          npm ci
          npm run build

      - name: Install Python & PyInstaller Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller xgboost

      - name: Build Standalone Executable
        run: |
          pyinstaller gateway.spec --clean --noconfirm

      - name: Verify Packaged XGBoost Native DLL
        run: |
          $exe = "dist\AdaptiveSecurityGateway.exe"
          if (Test-Path $exe) {
            Write-Host "Executable generated successfully: $exe"
          } else {
            Write-Error "Executable generation failed."
          }

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AdaptiveSecurityGateway-Windows-x64
          path: dist/AdaptiveSecurityGateway.exe
          retention-days: 14

