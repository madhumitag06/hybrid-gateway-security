name: Continuous Integration & Verification

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-test:
    name: Backend Test & Schema Verification
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hybrid_gateway_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5434/hybrid_gateway_db

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r ml/requirements.txt || true
          pip install pytest pytest-asyncio httpx xgboost scikit-learn psycopg psycopg-binary

      - name: Run Backend Pytest Suite
        run: |
          pytest -v backend/tests/test_cloud_abstraction.py backend/tests/test_aws_adapter.py backend/tests/test_gcp_adapter.py backend/tests/test_azure_adapter.py backend/tests/test_telemetry_normalization.py backend/tests/test_cloud_registry.py backend/tests/test_health.py backend/tests/test_feature_pipeline_v2.py backend/tests/test_shadow_mode_v2.py backend/tests/test_model_promotion_rollback.py

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Check & Vite Build
        run: npm run build
